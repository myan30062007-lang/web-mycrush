<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Mycrush - Chia sẻ sản phẩm hot, deal tốt nhất từ Shopee, TikTok Shop, Lazada">
  <meta name="theme-color" content="#0a0a0f">
  <title>Mycrush — Sản phẩm hot & Deal tốt nhất</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
</head>
<body>
  <div class="page-wrapper" id="app">

    <!-- Shop Header -->
    <header class="shop-header" id="shop-header">
      <div class="shop-avatar-wrapper">
        <div class="shop-avatar skeleton" id="shop-avatar" style="width:88px;height:88px;display:inline-block;"></div>
      </div>
      <h1 class="shop-name">Mycrush</h1>
      <p class="shop-desc">Chia sẻ sản phẩm hot, deal tốt nhất 🔥</p>
      <div class="social-links">
        <a href="#" class="social-link" title="TikTok" id="social-tiktok">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.88-2.89 2.89 2.89 0 0 1 2.88-2.89c.28 0 .55.04.81.1v-3.5a6.37 6.37 0 0 0-.81-.05A6.34 6.34 0 0 0 3.15 15a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.8a8.27 8.27 0 0 0 4.85 1.56V6.91a4.84 4.84 0 0 1-1.09-.22z"/></svg>
        </a>
        <a href="#" class="social-link" title="Facebook" id="social-facebook">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </a>
        <a href="#" class="social-link" title="YouTube" id="social-youtube">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </a>
      </div>
    </header>

    <!-- Search -->
    <div class="search-container" id="search-container">
      <div class="search-bar">
        <span class="search-icon">🔎</span>
        <input type="text" id="search-input" placeholder="Tìm sản phẩm..." autocomplete="off">
      </div>
    </div>

    <!-- Categories -->
    <div class="category-section" id="category-section">
      <div class="category-scroller" id="category-scroller">
        <button class="category-chip active" data-category="">Tất cả</button>
      </div>
    </div>

    <!-- Hot Products -->
    <div id="hot-section">
      <div class="section-header">
        <h2 class="section-title">🔥 Sản phẩm hot</h2>
      </div>
      <div class="product-grid" id="hot-products"></div>
    </div>

    <!-- All Products -->
    <div id="all-section">
      <div class="section-header">
        <h2 class="section-title">🛍️ Tất cả sản phẩm</h2>
      </div>
      <div class="product-grid" id="all-products"></div>
    </div>

    <!-- Loading -->
    <div class="loading-container" id="loading" style="display:none;">
      <div class="loading-spinner"></div>
      <span>Đang tải...</span>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="empty-state-icon">📦</div>
      <p class="empty-state-text">Không tìm thấy sản phẩm nào</p>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
