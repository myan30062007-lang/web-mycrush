<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Sản phẩm — Mycrush</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
</head>
<body>
  <div class="page-wrapper">
    <div class="product-detail" id="product-detail">

      <!-- Back nav -->
      <div class="product-back">
        <button class="back-btn" id="back-btn" onclick="history.back()">←</button>
        <span id="product-back-title">Sản phẩm</span>
      </div>

      <!-- Hero Image -->
      <div id="product-image-container">
        <div class="skeleton-image skeleton" style="width:100%;aspect-ratio:1;"></div>
      </div>

      <!-- Info -->
      <div class="product-info" id="product-info">
        <div class="skeleton skeleton-text" style="width:80%;height:24px;margin-bottom:12px;"></div>
        <div class="skeleton skeleton-text" style="width:40%;height:28px;margin-bottom:16px;"></div>
        <div class="skeleton skeleton-text medium"></div>
        <div class="skeleton skeleton-text short"></div>
      </div>

      <!-- Buy Links -->
      <div class="buy-section" id="buy-section"></div>
    </div>

    <!-- Sticky Buy Bar -->
    <div class="sticky-buy-bar" id="sticky-buy-bar" style="display:none;"></div>
  </div>

  <script src="/js/product.js"></script>
</body>
</html>
